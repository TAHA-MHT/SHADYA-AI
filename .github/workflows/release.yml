name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IOS_BUNDLE_ID: com.shadyaai.app

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Prepare keystore + key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_WORKSPACE/environment"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_WORKSPACE/environment/android.keystore"
          cat <<EOF > "$RUNNER_WORKSPACE/environment/key.properties"
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_WORKSPACE/environment/android.keystore
          EOF

      - name: Print SHA-256 fingerprint
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_WORKSPACE/environment/android.keystore" \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" | grep -A1 "SHA256"

      - name: Clean pub cache et reinstaller les dependances
        run: |
          flutter clean
          rm -rf ~/.pub-cache
          flutter pub get
          echo "----- Verification presence de vosk_flutter.dart -----"
          find ~/.pub-cache -path "*vosk_flutter_2*" -name "*.dart" || echo "AUCUN fichier vosk_flutter_2 trouve dans le cache !"

      - name: Build APK
        env:
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
        run: |
          flutter build apk --release --verbose \
            --dart-define=TUYA_CLIENT_ID="$TUYA_CLIENT_ID" \
            --dart-define=TUYA_CLIENT_SECRET="$TUYA_CLIENT_SECRET" \
            > build_log.txt 2>&1 || true
          echo "===================================================="
          echo "===== ERREURS DETECTEES AUTOMATIQUEMENT ====="
          echo "===================================================="
          grep -n -i -E "FAILURE|What went wrong|error:|Exception|Execution failed|Caused by" build_log.txt | tail -150 || echo "Aucun mot-cle d'erreur trouve automatiquement."
          echo "===================================================="
          echo "===== FIN DE LA RECHERCHE AUTOMATIQUE ====="
          echo "===================================================="
          echo ""
          echo "----- Dernieres 200 lignes du log complet -----"
          tail -200 build_log.txt

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: full-build-log
          path: build_log.txt
          retention-days: 1

      - name: Debug - list build outputs
        run: find android/app/build -name "*.apk" 2>/dev/null || echo "Nothing found"

      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: android/app/build/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
